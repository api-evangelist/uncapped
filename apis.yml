description: >-
  Uncapped provides working capital to online businesses, offering revenue-based
  financing products including merchant cash advances (MCA), term loans, and
  lines of credit (LOC). Through the Uncapped Partners API, platforms and
  marketplaces can embed business funding directly into their product without
  taking on origination, compliance, or servicing - submitting anonymised
  applicant performance data, generating pre-offer estimations, displaying
  ready-to-use funding Signals in their UI, and reacting to application and
  estimation lifecycle events via webhooks.
